<svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond carré arrondi -->
  <rect width="44" height="44" rx="10" fill="#0D1421"/>

  <!-- Nœud central -->
  <circle cx="22" cy="22" r="4" fill="white"/>

  <!-- Branche haut-gauche -->
  <line x1="19.2" y1="19.2" x2="10" y2="10" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="9" cy="9" r="3" fill="white"/>

  <!-- Branche haut-droite -->
  <line x1="24.8" y1="19.2" x2="34" y2="10" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="35" cy="9" r="3" fill="white"/>

  <!-- Branche bas -->
  <line x1="22" y1="26" x2="22" y2="36" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="22" cy="37" r="3" fill="white"/>

  <!-- Mini-branche depuis branche bas (gauche) -->
  <line x1="22" y1="32" x2="14" y2="38" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="13" cy="39" r="2" fill="#1B4FD8"/>

  <!-- Mini-branche depuis haut-gauche (droite) -->
  <line x1="13" y1="13" x2="8" y2="20" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="7" cy="21" r="2" fill="#1B4FD8"/>
</svg>
