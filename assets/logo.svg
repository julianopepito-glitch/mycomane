<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond -->
  <rect width="120" height="120" rx="24" fill="#FFFFFF"/>

  <!-- Filaments / mycélium (blancs sur fond foncé) -->
  <!-- Branche haut -->
  <line x1="60" y1="56" x2="60" y2="28" stroke="#0D1421" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Branche haut-droite depuis milieu -->
  <line x1="60" y1="38" x2="78" y2="22" stroke="#0D1421" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Branche haut-gauche depuis milieu -->
  <line x1="60" y1="34" x2="42" y2="18" stroke="#0D1421" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Branche bas-droite -->
  <line x1="63.5" y1="63.5" x2="88" y2="82" stroke="#0D1421" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Sous-branche droite -->
  <line x1="76" y1="73" x2="96" y2="62" stroke="#0D1421" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Sous-branche bas-droite terminale -->
  <line x1="88" y1="82" x2="92" y2="98" stroke="#0D1421" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Branche bas-gauche -->
  <line x1="56.5" y1="63.5" x2="32" y2="84" stroke="#0D1421" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Sous-branche gauche -->
  <line x1="42" y1="74" x2="20" y2="68" stroke="#0D1421" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Mini-branche terminale -->
  <line x1="32" y1="84" x2="28" y2="100" stroke="#0D1421" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Branche gauche -->
  <line x1="56" y1="60" x2="24" y2="52" stroke="#0D1421" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="55" x2="26" y2="40" stroke="#0D1421" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Branche droite -->
  <line x1="64" y1="58" x2="94" y2="44" stroke="#0D1421" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="82" y1="50" x2="90" y2="34" stroke="#0D1421" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Nœuds terminaux -->
  <circle cx="60" cy="26" r="3.5" fill="#1B4FD8"/>
  <circle cx="79" cy="21" r="3" fill="#0D1421"/>
  <circle cx="41" cy="17" r="2.6" fill="#0D1421"/>
  <circle cx="89" cy="83" r="3.2" fill="#0D1421"/>
  <circle cx="97" cy="61" r="2.8" fill="#1B4FD8"/>
  <circle cx="93" cy="99" r="2.4" fill="#0D1421"/>
  <circle cx="31" cy="85" r="3" fill="#0D1421"/>
  <circle cx="19" cy="68" r="2.6" fill="#1B4FD8"/>
  <circle cx="27" cy="101" r="2.2" fill="#0D1421"/>
  <circle cx="23" cy="52" r="3" fill="#0D1421"/>
  <circle cx="25" cy="39" r="2.4" fill="#0D1421"/>
  <circle cx="95" cy="43" r="2.8" fill="#0D1421"/>
  <circle cx="91" cy="33" r="2.4" fill="#1B4FD8"/>

  <!-- Nœuds intermédiaires -->
  <circle cx="76" cy="73" r="2.2" fill="#1B4FD8"/>
  <circle cx="42" cy="74" r="2.2" fill="#1B4FD8"/>
  <circle cx="38" cy="55" r="2" fill="#0D1421" opacity="0.6"/>
  <circle cx="82" cy="50" r="2" fill="#0D1421" opacity="0.6"/>

  <!-- Nœud central -->
  <circle cx="60" cy="60" r="7.5" fill="#0D1421"/>
  <circle cx="60" cy="60" r="4.5" fill="#1B4FD8"/>

</svg>
